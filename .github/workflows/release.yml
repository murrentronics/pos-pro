name: Build & Deploy Web

# Local `npm run cap:sync` builds the APK and EXE, publishes the GitHub
# release, and deploys Cloudflare Pages. This workflow does not run on push.
on:
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Node setup ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install JS deps ─────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build web bundle for Cloudflare Pages ───────────────────────────
      - name: Build web bundle
        run: |
          npx cross-env NODE_OPTIONS="--max-old-space-size=4096" \
            vite build --config vite.web.config.ts

      # ── 5. Copy logo into web dist (needed for PDF exports) ───────────────
      - name: Copy logo to web dist
        run: |
          cp public/logo.png dist/web/logo.png 2>/dev/null || \
          cp public-web/logo.png dist/web/logo.png 2>/dev/null || true

      # ── 6. Rename index.web.html → index.html ─────────────────────────────
      - name: Fix web index filename
        run: mv dist/web/index.web.html dist/web/index.html

      # Full release (APK + Cloudflare with /downloads) is `npm run cap:sync`.
      # CI must not pages-deploy a web folder without the APK — that wipes the installer.
      - name: Cloudflare deploy skipped
        run: |
          echo "Skipping wrangler pages deploy."
          echo "Run npm run cap:sync locally to build APK and deploy dist/web."
