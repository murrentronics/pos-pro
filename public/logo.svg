<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0047ab"/>
    </linearGradient>
    <radialGradient id="bg" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#061c36"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00b4ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00b4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.35"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#00b4ff" stroke-width="0.5" opacity="0.15"/>
  <!-- circuit traces -->
  <line x1="56" y1="200" x2="140" y2="200" stroke="#00b4ff" stroke-width="1.5" opacity="0.18"/>
  <line x1="56" y1="200" x2="56" y2="260" stroke="#00b4ff" stroke-width="1.5" opacity="0.18"/>
  <circle cx="56" cy="260" r="3" fill="#00b4ff" opacity="0.3"/>
  <line x1="372" y1="312" x2="456" y2="312" stroke="#00b4ff" stroke-width="1.5" opacity="0.18"/>
  <line x1="456" y1="312" x2="456" y2="252" stroke="#00b4ff" stroke-width="1.5" opacity="0.18"/>
  <circle cx="456" cy="252" r="3" fill="#00b4ff" opacity="0.3"/>
  <!-- P stem -->
  <rect x="148" y="110" width="52" height="292" rx="8" fill="url(#g)"/>
  <!-- P bowl top -->
  <rect x="148" y="110" width="158" height="52" rx="10" fill="url(#g)"/>
  <!-- P bowl bottom -->
  <rect x="148" y="228" width="148" height="48" rx="10" fill="url(#g)"/>
  <!-- P bowl right -->
  <rect x="258" y="110" width="52" height="166" rx="10" fill="url(#g)"/>
  <!-- PRO badge -->
  <rect x="182" y="430" width="148" height="44" rx="14" fill="url(#g)"/>
  <text x="256" y="460" font-family="Arial,sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#000d1a" letter-spacing="4">PRO</text>
